name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time; never cancel a running one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Downloads OpenCV.js (not committed: ~11 MB), copies the glTF decoders
      # and generates the placeholder model and icons.
      - name: Fetch assets
        run: |
          npm run assets
          node scripts/make-icons.mjs

      - run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        env:
          # GitHub Pages serves a project site from /<repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npx vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Only deploy from main; pull requests just build and test.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
